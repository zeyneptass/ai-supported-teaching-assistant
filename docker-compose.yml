volumes:
  n8n_storage:
  mongodb_data:

services:
  mongodb:
    image: mongo:latest
    container_name: akilli_ders_mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

  n8n:
    image: n8nio/n8n:latest
    container_name: akilli_ders_n8n
    restart: always
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
    environment:
      N8N_HOST: localhost
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: Europe/Istanbul
    depends_on:
      - mongodb