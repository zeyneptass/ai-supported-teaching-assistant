version: '3.8'

volumes:
  n8n_storage:
  mongodb_data:
  ollama_storage:

services:
  mongodb:
    image: mongo:latest
    container_name: akilli_ders_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123

  ollama:
    image: ollama/ollama:latest
    container_name: akilli_ders_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

  n8n:
    image: n8nio/n8n:latest
    container_name: akilli_ders_n8n
    restart: always
    ports:
      - "5679:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Istanbul
    depends_on:
      - mongodb
      - ollama